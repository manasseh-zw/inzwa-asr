name: stage-curated-150

resources:
  cloud: aws
  region: us-east-1
  instance_type: m6i.xlarge
  disk_size: 20

workdir: .

envs:
  AWS_REGION: us-east-1
  DESTINATION: s3://teleagents-research-102431378819-us-east-1/datasets/evaluations/curated-150/v1

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source "$HOME/.local/bin/env"
  uv sync --frozen --extra data

run: |
  source "$HOME/.local/bin/env"
  uv run python -m inzwa_asr.stage_curated \
    --destination "$DESTINATION" \
    --work-root /tmp/curated-150
