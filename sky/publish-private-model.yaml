name: inzwa-publish-private-model

resources:
  cloud: aws
  region: us-east-1
  instance_type: c6i.xlarge
  disk_size: 30

workdir: .

envs:
  AWS_REGION: us-east-1
  HF_REPO_ID: manassehzw/inzwa-asr-0.6b
  MODEL_URI: s3://teleagents-research-102431378819-us-east-1/models/asr/inzwa/adaptation/fleurs-adaptation-lr3e6-8bit-20260911a/inzwa-parakeet-tdt-0.6b-v3.nemo
  MODEL_SHA256: f6510ce38ebb9071eadce047afe7b4964c846833e5a8afc0c87c6d1bdbf1de1f
  TRAINING_PREFIX: s3://teleagents-research-102431378819-us-east-1/models/asr/inzwa/adaptation/fleurs-adaptation-lr3e6-8bit-20260911a
  EVALUATION_URI: s3://teleagents-research-102431378819-us-east-1/models/asr/inzwa/evaluations/fleurs-adaptation-step5750-20260911a/full-test-v1/summary.json
  SPEED_URI: s3://teleagents-research-102431378819-us-east-1/models/asr/inzwa/benchmarks/shona-speed-v1/parakeet-step5750.json
  HF_XET_HIGH_PERFORMANCE: "1"

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  curl -LsSf https://hf.co/cli/install.sh | bash

run: |
  set -euo pipefail
  source "$HOME/.local/bin/env"
  publish_root="$(mktemp -d /tmp/inzwa-model-publish.XXXXXX)"
  cp release/model/README.md "$publish_root/README.md"
  cp MODEL_PROFILE.md "$publish_root/MODEL_PROFILE.md"

  uv run --with boto3 python - "$publish_root" <<'PY'
  import os
  import sys
  from pathlib import Path

  import boto3

  root = Path(sys.argv[1])
  client = boto3.client("s3", region_name=os.environ["AWS_REGION"])

  def split_s3(uri: str) -> tuple[str, str]:
      value = uri.removeprefix("s3://")
      return tuple(value.split("/", 1))

  files = {
      os.environ["MODEL_URI"]: "inzwa-parakeet-tdt-0.6b-v3.nemo",
      f'{os.environ["TRAINING_PREFIX"]}/summary.json': "training-summary.json",
      f'{os.environ["TRAINING_PREFIX"]}/config.json': "training-config.json",
      os.environ["EVALUATION_URI"]: "evaluation-summary.json",
      os.environ["SPEED_URI"]: "speed-summary.json",
  }
  for uri, filename in files.items():
      bucket, key = split_s3(uri)
      client.download_file(bucket, key, str(root / filename))
  PY

  actual_sha256="$(sha256sum "$publish_root/inzwa-parakeet-tdt-0.6b-v3.nemo" | cut -d' ' -f1)"
  test "$actual_sha256" = "$MODEL_SHA256"
  printf '%s  %s\n' "$actual_sha256" inzwa-parakeet-tdt-0.6b-v3.nemo > "$publish_root/SHA256SUMS"

  hf upload "$HF_REPO_ID" "$publish_root" . \
    --private \
    --commit-message "Publish private Inzwa ASR 0.6B preview"
