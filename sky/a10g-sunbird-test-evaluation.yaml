name: inzwa-a10g-sunbird-test-evaluation

file_mounts:
  /home/ubuntu/.cache/huggingface/token: /Users/manasseh/.cache/huggingface/token

resources:
  cloud: aws
  region: us-east-1
  instance_type: g5.xlarge
  accelerators: A10G:1
  disk_size: 100

workdir: .

envs:
  AWS_REGION: us-east-1
  OUTPUT_PREFIX: s3://teleagents-research-102431378819-us-east-1/models/asr/inzwa/evaluations/sunbird-213531767f739bc5-20260911a/full-test-v1

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source "$HOME/.local/bin/env"
  uv sync --frozen --extra sunbird

run: |
  set -euo pipefail
  source "$HOME/.local/bin/env"
  uv sync --frozen --extra sunbird
  uv run python -c "import torch, transformers; print({'cuda': torch.cuda.get_device_name(0), 'transformers': transformers.__version__})"
  uv run python -c "from huggingface_hub import hf_hub_download; print(hf_hub_download('Sunbird/asr-whisper-51-african-languages', 'config.json', revision='213531767f739bc5b1e5dcb3e2ec9e112674ab67'))"
  uv run inzwa-evaluate-sunbird \
    --work-root "$HOME/inzwa-test-step5750-v1" \
    --output-prefix "$OUTPUT_PREFIX" \
    --batch-size 8
