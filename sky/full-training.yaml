name: inzwa-full-training

resources:
  cloud: aws
  region: us-east-1
  instance_type: g6e.xlarge
  accelerators: L40S:1
  disk_size: 250

workdir: .

envs:
  AWS_REGION: us-east-1
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  RELEASE_ROOT: /data/inzwa-release-v2
  RUN_ID: full-corpus-v2-seed42-20260909a
  S3_OUTPUT_PREFIX: s3://teleagents-research-102431378819-us-east-1/models/asr/inzwa/runs/full-corpus-v2-seed42-20260909a

setup: |
  curl -LsSf https://astral.sh/uv/install.sh | sh
  source "$HOME/.local/bin/env"
  uv sync --frozen --extra train
  uv run python -c "import nemo.collections.asr; import numba; import numpy"

run: |
  source "$HOME/.local/bin/env"
  uv run inzwa-release hydrate "$RELEASE_ROOT"
  uv run inzwa-release verify "$RELEASE_ROOT"
  uv run inzwa-preflight "$RELEASE_ROOT" --no-hydrate-audio --report preflight.json
  uv run inzwa-train \
    --release-root "$RELEASE_ROOT" \
    --output-dir "/data/$RUN_ID" \
    --run-id "$RUN_ID" \
    --output-prefix "$S3_OUTPUT_PREFIX" \
    --reuse-prepared-output
