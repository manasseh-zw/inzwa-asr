[project]
name = "inzwa-asr"
version = "0.1.0"
description = "Reproducible Shona ASR fine-tuning with NVIDIA Parakeet TDT"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.35,<2",
    "numpy>=1.26,<2",
    "scipy>=1.12,<2",
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
data = [
    "huggingface-hub>=0.27,<2",
    "pyarrow>=18,<20",
]
train = [
    "comet-ml>=3.47,<4",
    "jiwer>=3.1,<4",
    "lightning>=2.4,<3",
    "huggingface-hub>=0.27,<1",
    "nemo-toolkit[asr]>=2.4,<3",
    "numba-cuda[cu12]==0.15.1",
    "pyarrow>=18,<20",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
inzwa-release = "inzwa_asr.release:main"
inzwa-preflight = "inzwa_asr.preflight:main"
inzwa-train = "inzwa_asr.training:main"
inzwa-evaluate = "inzwa_asr.test_evaluation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inzwa_asr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
